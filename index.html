<style>
/* Layout: galaxy backdrop; floating liquid-glass top bar with business tabs, floating glass dock on the left (bottom bar on phones), glass panels in a scroll pane. Dark-first. */
:root{
  color-scheme:dark;

  --field:rgba(10,5,24,.42); --field-solid:#120A24;

  --sheen:rgba(255,255,255,.10); --sheen-2:rgba(183,155,255,.12);
  --shade:0 26px 60px -30px rgba(0,0,0,.85),0 2px 8px rgba(0,0,0,.25);
  --shade-2:0 40px 90px -30px rgba(0,0,0,.9),0 4px 14px rgba(0,0,0,.35);
  --accent:#BBA0FF; --accent-2:#E3A6FF; --accent-strong:#8B5CF6; --accent-ink:#120726;
  --accent-soft:rgba(187,160,255,.16); --accent-softer:rgba(187,160,255,.08);
  --good:#62E7AE; --good-soft:rgba(98,231,174,.14);
  --warn:#FFCB7A; --warn-soft:rgba(255,203,122,.15);
  --bad:#FF8FAB; --bad-soft:rgba(255,143,171,.15);
  --info:#98B6FF; --info-soft:rgba(152,182,255,.15);
  --ch-web:#BBA0FF; --ch-youtube:#FF7D88; --ch-instagram:#F590D8; --ch-tiktok:#5FE3D2; --ch-x:#CFD2E0; --ch-linkedin:#8DABFF;
  --neb-1:rgba(150,70,240,.42); --neb-2:rgba(214,72,230,.24); --neb-3:rgba(70,60,220,.30); --star:1;
  --focus:#E3D4FF;
  --font-display:"Unbounded","Manrope",ui-sans-serif,system-ui,sans-serif;
  --font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r-s:12px; --r-m:18px; --r-l:26px; --r-xl:34px;

}

  --ch-web:#6A2BD9; --ch-youtube:#D7323F; --ch-instagram:#BF2F87; --ch-tiktok:#0B8C7E; --ch-x:#505466; --ch-linkedin:#2F5CCF;
  --neb-1:rgba(170,120,255,.45); --neb-2:rgba(240,150,230,.38); --neb-3:rgba(140,160,255,.35); --star:0;

}}
:root[data-theme="light"]{

:root[data-theme="dark"]{color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;font-feature-settings:"ss01"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--bg)}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(1.35rem,1.1rem + 1vw,1.85rem);letter-spacing:-.01em}
h2{font-weight:800;font-size:1.08rem;letter-spacing:-.01em}
h3{font-weight:700;font-size:.98rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.86rem} .xs{font-size:.76rem}
.eyebrow{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:3px;border-radius:12px}
.skip{position:fixed;left:16px;top:-80px;z-index:300;padding:10px 16px;border-radius:999px;background:var(--accent-strong);color:#fff;border:0;font-weight:700}
.skip:focus{top:calc(12px + env(safe-area-inset-top,0px))}

/* ---------- Cosmos ---------- */
.cosmos{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:
  radial-gradient(ellipse 55% 42% at 78% 14%,var(--neb-1),transparent 62%),
  radial-gradient(ellipse 48% 38% at 12% 86%,var(--neb-2),transparent 62%),
  radial-gradient(ellipse 42% 34% at 42% 48%,var(--neb-3),transparent 66%),var(--bg)}
.cosmos canvas{position:absolute;inset:0;width:100%;height:100%;opacity:var(--star)}
.cosmos .galaxy{position:absolute;width:62vmax;height:62vmax;right:-18vmax;top:-22vmax;border-radius:50%;opacity:.55;filter:blur(18px);background:conic-gradient(from 20deg,transparent 0 8%,var(--neb-1) 14%,transparent 26% 46%,var(--neb-2) 56%,transparent 68% 100%);-webkit-mask:radial-gradient(circle,#000 0 18%,rgba(0,0,0,.65) 40%,transparent 70%);mask:radial-gradient(circle,#000 0 18%,rgba(0,0,0,.65) 40%,transparent 70%);animation:spin 240s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Liquid glass ---------- */
.glass{position:relative;isolation:isolate;background:linear-gradient(160deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border-radius:var(--r-l);box-shadow:inset 0 1px 0 var(--spec),inset 0 0 0 1px var(--rim),var(--shade)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;background:radial-gradient(130% 70% at 12% -25%,var(--sheen),transparent 52%),radial-gradient(80% 60% at 112% 125%,var(--sheen-2),transparent 62%)}
.lq{--mx:50%;--my:50%}
.lq::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(140px circle at var(--mx) var(--my),var(--glass-hi),transparent 62%);mix-blend-mode:soft-light}
.lq:hover::after{opacity:1}
.agenda-item,.li,.vcard,.wtab{position:relative;overflow:hidden}
.btn::after,.card::after,.wtab::after,.li::after,.vcard::after,.agenda-item::after,.dock a::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(150px circle at var(--mx,50%) var(--my,50%),var(--glass-hi),transparent 62%)}
.btn:hover::after,.card:hover::after,.wtab:hover::after,.li:hover::after,.vcard:hover::after,.agenda-item:hover::after,.dock a:hover::after{opacity:.85}
.solid .glass,.solid .glass-lite{background:var(--glass-solid);-webkit-backdrop-filter:none;backdrop-filter:none}
.solid .cosmos .galaxy{display:none}

/* ---------- Shell ---------- */
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:12px;padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:999px;z-index:40;min-width:0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none;padding-right:6px}
.brand svg{width:38px;height:38px;flex:none;filter:drop-shadow(0 4px 16px rgba(150,70,255,.6))}
.brand b{font-family:var(--font-display);font-weight:600;font-size:.98rem;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.brand b span{display:block;font-family:var(--font);font-size:.62rem;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}
.tabs-ws{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs-ws::-webkit-scrollbar{display:none}
.wtab{position:relative;display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border-radius:999px;border:0;background:transparent;color:var(--ink-2);font-weight:650;font-size:.88rem;cursor:pointer;white-space:nowrap;transition:background .25s var(--ease),color .2s,transform .2s var(--spring);flex:none}
.wtab:hover{background:var(--accent-softer);color:var(--ink)}
.wtab[aria-selected="true"]{color:var(--ink);background:linear-gradient(160deg,var(--glass-hi),var(--glass-a));box-shadow:inset 0 1px 0 var(--spec),inset 0 0 0 1px var(--rim-2),0 8px 22px -14px rgba(0,0,0,.6)}
.wtab:active{transform:scale(.96)}
.wtab .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.62rem;font-weight:800;color:#fff;background:var(--c,var(--accent-strong));box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.wtab .cnt{font-size:.68rem;color:var(--muted);font-weight:700}
.wtab.add{padding:7px 10px;color:var(--muted)}
.tb-act{display:flex;align-items:center;gap:4px;flex:none;position:relative}
.dock{position:relative;display:flex;flex-direction:column;gap:2px;padding:12px 10px;border-radius:var(--r-xl);width:232px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;transition:width .35s var(--ease)}
.dock.mini{width:76px}
.dock .grp{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:800;padding:12px 12px 4px;white-space:nowrap;transition:opacity .2s}
.dock.mini .grp{opacity:0;height:10px;padding:0}
.dock a{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:16px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:.9rem;white-space:nowrap;transition:color .2s,background .2s}
.dock a:hover{color:var(--ink);background:var(--accent-softer)}
.dock a[aria-current="page"]{color:var(--ink)}
.dock a[aria-current="page"] .i{color:var(--accent)}
.dock a .lbl{transition:opacity .2s}
.dock.mini a{justify-content:center;padding:11px}
.dock.mini a .lbl{opacity:0;width:0;overflow:hidden}
.dock a .bd{margin-left:auto}
.dock.mini a .bd{position:absolute;top:3px;right:3px}
.lens{position:absolute;left:10px;right:10px;z-index:0;border-radius:16px;pointer-events:none;background:linear-gradient(160deg,var(--glass-hi),var(--glass-a));box-shadow:inset 0 1px 0 var(--spec),inset 0 0 0 1px var(--rim-2),0 10px 26px -14px rgba(120,60,255,.7);transition:top .45s var(--spring),height .45s var(--spring)}
.dock-foot{margin-top:auto;padding-top:10px;display:flex;flex-direction:column;gap:2px}
.mode-chip{display:flex;gap:8px;align-items:flex-start;margin:6px 4px 2px;padding:10px 12px;border-radius:16px;background:var(--accent-softer);box-shadow:inset 0 0 0 1px var(--rim);font-size:.76rem;color:var(--ink-2)}
.dock.mini .mode-chip{display:none}
.main{position:relative;min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;border-radius:var(--r-xl);scrollbar-width:thin}
#view{max-width:1380px;margin:0 auto;padding:6px max(4px,env(safe-area-inset-right,0px)) 60px 4px;display:flex;flex-direction:column;gap:18px;outline:none}
#view.enter{animation:viewIn .42s var(--ease)}
@keyframes viewIn{from{opacity:.25;transform:translateY(10px) scale(.995);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.bottombar{display:none}

/* ---------- Controls ---------- */
.btn{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:999px;border:0;background:linear-gradient(160deg,var(--glass-hi),var(--glass-a));color:var(--ink);font-weight:700;font-size:.87rem;cursor:pointer;white-space:nowrap;box-shadow:inset 0 1px 0 var(--spec),inset 0 0 0 1px var(--rim),0 6px 18px -12px rgba(0,0,0,.6);transition:transform .25s var(--spring),box-shadow .2s,filter .2s;text-decoration:none}
.btn:hover{box-shadow:inset 0 1px 0 var(--spec),inset 0 0 0 1px var(--rim-2),0 10px 24px -12px rgba(0,0,0,.7)}
.btn:active{transform:scale(.95)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{color:#fff;background:linear-gradient(180deg,#C9AEFF 0%,#9B6BFF 42%,#7C3AED 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -3px 8px rgba(60,0,130,.35),0 12px 30px -12px rgba(139,92,246,.9)}
.btn.primary:hover{filter:brightness(1.08) saturate(1.1)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--accent-softer);box-shadow:none}

.btn.sm{min-height:32px;padding:5px 12px;font-size:.8rem}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink-2);cursor:pointer;transition:background .2s,color .2s,transform .25s var(--spring);flex:none}
.icon-btn:hover{background:var(--accent-softer);color:var(--ink)}
.icon-btn:active{transform:scale(.9)}
.icon-btn.sm{width:32px;height:32px}
.icon-btn[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.icon-btn .dot{position:absolute;top:4px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:linear-gradient(180deg,#FF9AB5,#E2416E);color:#fff;font-size:.62rem;font-weight:800;display:grid;place-items:center}
.icon-btn[disabled]{opacity:.4;cursor:not-allowed}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.74rem;color:#fff;background:linear-gradient(140deg,#9B6BFF,#E36BE8);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:.8rem;font-weight:700;color:var(--ink-2)}
.hint{font-size:.76rem;color:var(--muted)}
.err{font-size:.78rem;color:var(--bad);font-weight:600;display:flex;gap:6px;align-items:flex-start}
.input,.select,.textarea{width:100%;min-height:42px;padding:9px 14px;border-radius:14px;border:0;background:var(--field);color:var(--ink);box-shadow:inset 0 1px 2px rgba(0,0,0,.18),inset 0 0 0 1px var(--rim);transition:box-shadow .2s}
.textarea{min-height:96px;resize:vertical;line-height:1.55}
.input::placeholder,.textarea::placeholder{color:var(--faint)}
.input:focus,.select:focus,.textarea:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--accent),0 0 0 5px var(--accent-soft)}
.input[aria-invalid="true"],.select[aria-invalid="true"],.textarea[aria-invalid="true"]{box-shadow:inset 0 0 0 1.5px var(--bad),0 0 0 4px var(--bad-soft)}
.select{appearance:none;padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.select option{background:var(--field-solid);color:var(--ink)}
.search{position:relative;min-width:0}
.search .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .input{padding-left:40px}
.seg{display:inline-flex;padding:4px;gap:2px;border-radius:999px;background:var(--field);box-shadow:inset 0 1px 2px rgba(0,0,0,.2),inset 0 0 0 1px var(--rim);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:.82rem;font-weight:700;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:32px;transition:color .2s,background .35s var(--ease),box-shadow .35s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--ink);background:linear-gradient(160deg,var(--glass-hi),var(--glass-a));box-shadow:inset 0 1px 0 var(--spec),inset 0 0 0 1px var(--rim-2),0 6px 14px -8px rgba(0,0,0,.6)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;border:0;background:var(--field);box-shadow:inset 0 0 0 1px var(--rim);font-size:.8rem;font-weight:700;color:var(--ink-2);cursor:pointer;min-height:32px;transition:all .2s}
.fchip:hover{box-shadow:inset 0 0 0 1px var(--rim-2)}
.fchip[aria-pressed="true"],.fchip[data-on="true"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.fchip:has(input:focus-visible){outline:2.5px solid var(--focus);outline-offset:2px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent-strong)}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:.88rem}
.toggle input{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--field);box-shadow:inset 0 0 0 1px var(--rim-2);position:relative;cursor:pointer;transition:background .25s;flex:none}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#fff,#E9E2FF);box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .35s var(--spring)}
.toggle input:checked{background:linear-gradient(180deg,#B28CFF,#7C3AED)}
.toggle input:checked::after{transform:translateX(18px)}
input[type="range"]{accent-color:var(--accent-strong);width:100%}
input[type="color"]{width:44px;height:36px;border:0;border-radius:12px;background:var(--field);padding:3px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--rim)}

/* ---------- Content ---------- */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:8px 6px 0}
.page-h .t{display:flex;flex-direction:column;gap:8px;min-width:0}
.page-h .sub{color:var(--muted);max-width:70ch}
.page-h .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{padding:20px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.panel-h .t{display:flex;flex-direction:column;gap:3px}
.panel-h .t p{font-size:.82rem;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .search{flex:1 1 240px}
.toolbar .select{width:auto;min-width:160px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g-cards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.stack.tight{gap:6px}
.divider{height:1px;background:var(--rim);border:0;margin:4px 0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:800;white-space:nowrap;background:var(--field);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rim)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.pill.good{background:var(--good-soft);color:var(--good);box-shadow:none}
.pill.warn{background:var(--warn-soft);color:var(--warn);box-shadow:none}
.pill.bad{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.pill.info{background:var(--info-soft);color:var(--info);box-shadow:none}
.pill.accent{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.badge{min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.7rem;font-weight:800;display:inline-grid;place-items:center}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.ch{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:700;color:var(--ink-2);white-space:nowrap;min-width:0}
.ch i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
.ch .h{color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;padding:2px 9px;border-radius:999px;background:var(--field);box-shadow:inset 0 0 0 1px var(--rim);font-size:.72rem;color:var(--ink-2);font-weight:600}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:.76rem;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.delta.up{color:var(--good);background:var(--good-soft)} .delta.down{color:var(--bad);background:var(--bad-soft)} .delta.flat{color:var(--muted);background:var(--field)}
.kpi{display:flex;flex-direction:column;gap:6px;padding:16px 18px 14px;border-radius:var(--r-l)}
.kpi .lab{font-size:.8rem;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:6px}
.kpi .val{font-weight:800;font-size:1.85rem;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .foot{font-size:.74rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.kpi svg.spark{width:100%;height:34px}
.kpi.na .val{font-size:1.1rem;color:var(--muted)}
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .gl{stroke:var(--rim);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font);font-weight:600}
.chart .guide{stroke:var(--rim-2);stroke-dasharray:3 3}
.chart-tip{position:absolute;top:6px;pointer-events:none;padding:9px 12px;font-size:.78rem;min-width:160px;z-index:2;transition:opacity .15s;border-radius:16px;background:var(--glass-solid);box-shadow:inset 0 0 0 1px var(--rim-2),var(--shade-2)}
.chart-tip b{display:block;margin-bottom:4px}
.chart-tip .r{display:flex;justify-content:space-between;gap:12px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;margin-top:10px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 78px;gap:12px;align-items:center;font-size:.84rem}
.bar-track{height:10px;border-radius:999px;background:var(--field);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,color-mix(in oklab,var(--c,var(--accent)) 60%,transparent),var(--c,var(--accent)));box-shadow:0 0 12px var(--c,var(--accent));transform-origin:left;animation:grow .7s var(--ease) both}
@keyframes grow{from{transform:scaleX(.05)}}
.heat{display:grid;grid-template-columns:44px repeat(8,minmax(0,1fr));gap:5px;font-size:.72rem}
.heat .hc{height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800}
.heat .hl{color:var(--muted);display:grid;place-items:center;font-weight:700}
.ai-mark{display:inline-flex;align-items:center;gap:7px;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.ai-panel{background:linear-gradient(160deg,color-mix(in oklab,var(--accent-strong) 22%,var(--glass-a)),var(--glass-b) 70%)}
.ai-list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.ai-list li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;font-size:.88rem}
.ai-list .ico{width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.ai-list .positivo .ico{background:var(--good-soft);color:var(--good)} .ai-list .negativo .ico{background:var(--bad-soft);color:var(--bad)}
.ai-list .neutro .ico,.ai-list .accion .ico{background:var(--accent-soft);color:var(--accent)} .ai-list .falta .ico{background:var(--warn-soft);color:var(--warn)}
.thinking{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:.86rem}
.orbit{width:22px;height:22px;position:relative;flex:none}
.orbit::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--accent)}
.orbit::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--accent-2);animation:spin .9s linear infinite}
.skeleton{height:12px;border-radius:999px;background:linear-gradient(90deg,var(--field),var(--glass-hi),var(--field));background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.ai-text{white-space:pre-wrap;font-size:.9rem;line-height:1.6}
.tbl-wrap{overflow-x:auto}
.rtable{width:100%;border-collapse:separate;border-spacing:0;font-size:.87rem}
.rtable th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;padding:10px 12px;border-bottom:1px solid var(--rim);white-space:nowrap}
.rtable td{padding:12px;border-bottom:1px solid var(--rim);vertical-align:middle}
.rtable tr:last-child td{border-bottom:0}
.rtable tbody tr{transition:background .2s}
.rtable tbody tr:hover{background:var(--accent-softer)}
.rtable .r{text-align:right;font-variant-numeric:tabular-nums}
.rtable .clip{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:var(--r-l);min-width:0;transition:transform .35s var(--spring),box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 var(--spec),inset 0 0 0 1px var(--rim-2),var(--shade-2)}
.card h3{font-size:1rem;line-height:1.3}
.card .desc{color:var(--ink-2);font-size:.88rem}
.card .acts{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:10px;border-top:1px solid var(--rim)}
.card.archived{opacity:.65}
.card.new{animation:pop .55s var(--spring)}
@keyframes pop{from{transform:scale(.92);opacity:.2}}
ul.clean{list-style:none;margin:0;padding:0}
.approach{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--ink-2)}
.approach li{display:flex;gap:8px}
.approach li::before{content:"";flex:none;width:6px;height:6px;margin-top:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.score{position:relative;width:56px;height:56px;flex:none;display:grid;place-items:center;border-radius:50%;font-weight:800;font-size:1.05rem;color:#fff;background:radial-gradient(circle at 35% 30%,#E6D7FF,#9B6BFF 45%,#5B21B6);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 24px -8px rgba(139,92,246,.9)}
.score.mid{background:radial-gradient(circle at 35% 30%,#DCE4FF,#8A9BFF 45%,#4338CA)}
.score.low{background:radial-gradient(circle at 35% 30%,#E5E1EF,#9C95B4 45%,#5C5675)}
.factors{display:flex;flex-direction:column;gap:9px;padding:12px;border-radius:16px;background:var(--field);box-shadow:inset 0 0 0 1px var(--rim)}
.factor{display:grid;grid-template-columns:minmax(0,1fr) 42px;gap:4px 10px;font-size:.8rem;align-items:center}
.factor .bar-track{grid-column:1/-1;height:6px}
.factor p{grid-column:1/-1;color:var(--muted);font-size:.75rem}

/* Calendar */
.cal{border-radius:var(--r-l);overflow:hidden}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-head div{padding:10px;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;border-bottom:1px solid var(--rim)}
.cal-cell{position:relative;min-height:118px;padding:6px;border-right:1px solid var(--rim);border-bottom:1px solid var(--rim);display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:background .2s;min-width:0}
.cal-grid .cal-cell:nth-child(7n){border-right:0}
.cal-cell:hover{background:var(--accent-softer)}
.cal-cell.out{opacity:.5}
.cal-cell.sel{background:var(--accent-softer);box-shadow:inset 0 0 0 2px var(--accent)}
.cal-cell.over{background:var(--accent-soft)}
.cal-cell .dn{font-size:.8rem;font-weight:800;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;border:0;background:transparent;color:inherit;cursor:pointer}
.cal-cell.today .dn{background:linear-gradient(180deg,#C9AEFF,#7C3AED);color:#fff;box-shadow:0 4px 14px -4px rgba(139,92,246,.9)}
.cal-chip{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:10px;font-size:.73rem;border:0;background:var(--field);box-shadow:inset 0 0 0 1px var(--rim);cursor:grab;min-width:0;text-align:left;color:var(--ink);width:100%;transition:transform .2s var(--spring)}
.cal-chip:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1px var(--rim-2)}
.cal-chip .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.cal-chip .tm{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.cal-chip.st-programado{box-shadow:inset 0 0 0 1px var(--accent)}
.cal-chip.st-publicado{background:var(--good-soft);box-shadow:none}
.cal-chip.st-error{background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)}
.cal-chip.st-publicando{background:var(--info-soft);box-shadow:none}
.cal-chip.st-en-revisión{background:var(--warn-soft);box-shadow:none}
.cal-chip.dragging{opacity:.4}
.cal-dots{display:none;gap:3px;justify-content:center}
.cal-dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.more{font-size:.72rem;color:var(--accent);font-weight:800;padding:0 4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-radius:var(--r-l);overflow:hidden}
.week .col{border-right:1px solid var(--rim);min-height:360px;display:flex;flex-direction:column;min-width:0}
.week .col:last-child{border-right:0}
.week .col-h{padding:10px;border-bottom:1px solid var(--rim);display:flex;align-items:baseline;gap:6px}
.week .col-h b{font-family:var(--font-display);font-size:1.2rem}
.week .col-h.today b{color:var(--accent)}
.week .col-b{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.week .cal-chip{flex-direction:column;align-items:flex-start;padding:8px}
.week .cal-chip .tt{white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.agenda{display:flex;flex-direction:column;gap:8px}
.agenda-item{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-radius:16px;border:0;background:var(--field);box-shadow:inset 0 0 0 1px var(--rim);cursor:pointer;text-align:left;width:100%;color:var(--ink);transition:transform .25s var(--spring),box-shadow .2s}
.agenda-item:hover{transform:translateX(3px);box-shadow:inset 0 0 0 1px var(--accent)}
.agenda-item .tm{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.statstrip{display:flex;gap:8px;flex-wrap:wrap}
.statstrip .s{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;font-size:.84rem}
.statstrip .s b{font-size:1.1rem;font-weight:800}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding:2px 2px 10px}
.lane{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--r-l);min-height:260px;transition:background .2s}
.lane.over{background:var(--accent-soft)}
.lane-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;font-weight:800;font-size:.86rem}
.vcard{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:18px;border:0;background:var(--field);box-shadow:inset 0 0 0 1px var(--rim);cursor:grab;text-align:left;color:var(--ink);width:100%;transition:transform .25s var(--spring),box-shadow .2s}
.vcard:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px var(--rim-2),var(--shade)}
.vcard.synced{cursor:pointer}
.vthumb{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#5B21B6,#C026D3);display:grid;place-items:center;color:#fff;font-weight:800;font-size:.78rem;text-align:center;padding:8px}
.vthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vthumb .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.72);color:#fff;font-family:var(--mono);font-size:.66rem;padding:1px 6px;border-radius:6px}
.split{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:14px;align-items:start}
.list-pane{display:flex;flex-direction:column;gap:10px;min-width:0}
.list-items{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 300px);overflow-y:auto;padding:2px}
.li{position:relative;display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:18px;border:0;background:var(--field);box-shadow:inset 0 0 0 1px var(--rim);cursor:pointer;text-align:left;width:100%;color:var(--ink);transition:box-shadow .2s,transform .25s var(--spring)}
.li:hover{box-shadow:inset 0 0 0 1px var(--rim-2)}
.li[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.li .top{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.li .txt{font-size:.87rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li.unread .txt{font-weight:800}
.back-btn{display:none!important}
.sec-block{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:12px;border-radius:18px;background:var(--field);box-shadow:inset 0 0 0 1px var(--rim);align-items:start}
.sec-block .handle{display:flex;flex-direction:column;gap:2px}
.sec-block .kind{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--accent)}
.thread{display:flex;flex-direction:column;gap:10px}
.bubble{padding:12px 15px;border-radius:20px 20px 20px 6px;background:var(--field);box-shadow:inset 0 0 0 1px var(--rim);max-width:640px;overflow-wrap:anywhere}
.bubble.mine{align-self:flex-end;border-radius:20px 20px 6px 20px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--accent) 40%,transparent)}
.bubble .who{font-size:.76rem;color:var(--muted);margin-bottom:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.preview-card{border-radius:22px;overflow:hidden;background:var(--glass-solid);box-shadow:inset 0 0 0 1px var(--rim),var(--shade)}
.pv-h{display:flex;align-items:center;gap:10px;padding:12px 14px}
.pv-b{padding:0 14px 12px;white-space:pre-wrap;font-size:.9rem;overflow-wrap:anywhere}
.pv-b .ht{color:var(--accent)}
.pv-media{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:2px}
.pv-media img,.pv-media video{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#000}
.pv-media .vid{aspect-ratio:16/9;display:grid;place-items:center;background:#12082A;color:#fff;font-size:.8rem;gap:6px;padding:10px;text-align:center}
.pv-link{margin:0 14px 14px;border-radius:14px;padding:10px 12px;font-size:.8rem;color:var(--muted);box-shadow:inset 0 0 0 1px var(--rim);overflow-wrap:anywhere}
.pv-foot{display:flex;gap:16px;padding:10px 14px;border-top:1px solid var(--rim);font-size:.76rem;color:var(--muted)}
.counter{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.counter.over{color:var(--bad);font-weight:800}
.media-list{display:flex;gap:8px;flex-wrap:wrap}
.media-item{position:relative;width:86px;height:86px;border-radius:16px;overflow:hidden;background:var(--field);box-shadow:inset 0 0 0 1px var(--rim);display:grid;place-items:center;font-size:.66rem;text-align:center;padding:4px;color:var(--ink-2)}
.media-item img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media-item button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer}
.media-item .prog{position:absolute;left:6px;right:6px;bottom:6px;height:4px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden}
.media-item .prog i{display:block;height:100%;background:#fff;width:var(--p,0%)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rim);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:700;font-size:.83rem;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.notice{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:18px;background:var(--info-soft);font-size:.86rem;box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--info) 30%,transparent)}
.notice>.i{color:var(--info);flex:none;margin-top:1px}
.notice.warn{background:var(--warn-soft);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--warn) 30%,transparent)} .notice.warn>.i{color:var(--warn)}
.notice.bad{background:var(--bad-soft);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--bad) 30%,transparent)} .notice.bad>.i{color:var(--bad)}
.notice.good{background:var(--good-soft);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--good) 30%,transparent)} .notice.good>.i{color:var(--good)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:44px 22px;border-radius:var(--r-l)}
.empty .orb{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 35% 28%,#EBDDFF,#9B6BFF 42%,#4C1D95 85%);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -8px 18px rgba(40,0,90,.5),0 18px 40px -14px rgba(139,92,246,.9)}
.empty p{color:var(--muted);max-width:48ch;font-size:.9rem}
details.finding{border-radius:var(--r-l)}
details.finding summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 18px}
details.finding summary::-webkit-details-marker{display:none}
details.finding .chev{transition:transform .35s var(--spring);color:var(--muted)}
details.finding[open] .chev{transform:rotate(180deg)}
.prio{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}

}
async function flushSave(){
  if(MODE!=='server'||!dirty)return;
  if(saving){clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,300);return}
  saving=true;dirty=false;clearTimeout(saveTimer);
  try{
    const r=await api('/api/state',{method:'PUT',body:{state:S,baseVersion:SRV.stateVersion}});
    SRV.stateVersion=r.stateVersion;
    if(r.state){S=normalizeState(r.state);rerenderSoft()}
  }catch(e){dirty=true;toast('No se pudieron guardar los cambios en el servidor: '+e.message+'. Se reintentará.','bad');clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,8000)}
  finally{saving=false}
}

async function api(path,{method='GET',body,raw,headers={},onProgress}={}){
  const opts={method,credentials:'same-origin',headers:{'x-gu':'1',...headers}};
  if(body!==undefined&&!raw){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}
  if(raw)opts.body=raw;
  const r=await fetch(path,opts);
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&!['/api/login','/api/register'].includes(path)){showLogin();throw Object.assign(new Error('Inicia sesión.'),{status:401})}
  if(!r.ok)throw Object.assign(new Error(j.error||`Error ${r.status}`),{status:r.status,code:j.code,field:j.field});
  return j;
}
function uploadFile(file,onProgress){
  return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('POST','/api/media');x.setRequestHeader('x-gu','1');x.setRequestHeader('x-file-name',encodeURIComponent(file.name));x.setRequestHeader('Content-Type',file.type||'application/octet-stream');
    x.upload.onprogress=e=>{if(e.lengthComputable&&onProgress)onProgress(e.loaded/e.total)};
    x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}x.status<300?res(j):rej(new Error(j.error||'No se pudo subir el archivo.'))};
    x.onerror=()=>rej(new Error('No se pudo subir el archivo.'));x.send(file)});
}

const MODALS=[];
function openModal({title,body,footer='',size='',drawer=false,onMount,onClose}){

  document.body.append(wrap);
  const m={el:wrap,close(){if(m.closed)return;m.closed=true;wrap.classList.add('closing');const i=MODALS.indexOf(m);if(i>-1)MODALS.splice(i,1);setTimeout(()=>wrap.remove(),190);onClose&&onClose();if(prev&&prev.isConnected)prev.focus({preventScroll:true})}};

}

const CHREG={};

function niceStep(max,count){const raw=max/count;const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function drawLine(el,cfg){
  const W=Math.max(el.clientWidth,260),H=el.clientHeight||240,pl=48,pr=14,pt=10,pb=26;
  const ser=cfg.series.filter(s=>s.values&&s.values.some(v=>v!=null));const n=cfg.labels.length;
  if(!ser.length||!n){el.innerHTML='';return}
  const all=ser.flatMap(s=>s.values).filter(v=>v!=null);
  let mn=cfg.zero===false?Math.min(...all):0,mx=Math.max(...all,1);
  if(cfg.zero===false){const pad=(mx-mn)*.15||mx*.05||1;mn=Math.max(0,mn-pad);mx+=pad}
  const step=niceStep(mx-mn,4);const lo=cfg.zero===false?Math.floor(mn/step)*step:0;const top=Math.ceil(mx/step)*step||1;
  const x=i=>pl+(n<=1?(W-pl-pr)/2:i*(W-pl-pr)/(n-1)),y=v=>pt+(H-pt-pb)*(1-(v-lo)/(top-lo||1));
  const fmt=cfg.fmt||fmtN;
  let g='';for(let v=lo;v<=top+1e-9;v+=step)g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-8}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
  const nl=Math.max(2,Math.min(n,Math.floor((W-pl)/90)));
  for(let k=0;k<nl;k++){const i=n<=1?0:Math.round(k*(n-1)/(nl-1));g+=`<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="${k===0?'start':k===nl-1?'end':'middle'}">${esc(cfg.labels[i])}</text>`;if(n<=1)break}
  let paths='';
  ser.forEach(s=>{
    let d='',started=false;const pts=[];
    s.values.forEach((v,i)=>{if(v==null){started=false;return}const px=x(i).toFixed(1),py=y(v).toFixed(1);d+=(started?'L':'M')+px+','+py;started=true;pts.push([px,py])});
    if(cfg.area&&ser.length===1&&pts.length>1){const gid='ag'+Math.random().toString(36).slice(2,7);paths+=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${s.color};stop-opacity:.35"/><stop offset="1" style="stop-color:${s.color};stop-opacity:0"/></linearGradient></defs><path d="M${pts[0][0]},${y(lo)}L${pts.map(p=>p.join(',')).join('L')}L${pts[pts.length-1][0]},${y(lo)}Z" style="fill:url(#${gid})"/>`}
    paths+=`<path d="${d}" style="fill:none;stroke:${s.color};stroke-width:${ser.length>3?2:2.6};stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 6px ${s.color})"/>`;
    const lp=pts[pts.length-1];if(lp)paths+=`<circle cx="${lp[0]}" cy="${lp[1]}" r="4" style="fill:${s.color};stroke:var(--glass-solid);stroke-width:2"/>`;
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${g}${paths}<line class="guide" x1="0" x2="0" y1="${pt}" y2="${H-pb}" style="opacity:0"/><rect x="${pl}" y="0" width="${W-pl-pr}" height="${H}" style="fill:transparent"/></svg><div class="chart-tip" style="opacity:0"></div>`;
  const svg=el.querySelector('svg'),tip=el.querySelector('.chart-tip'),guide=el.querySelector('.guide');
  svg.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)*(W/r.width);const i=clamp(Math.round((px-pl)/((W-pl-pr)/(n-1||1))),0,n-1);
    guide.setAttribute('x1',x(i));guide.setAttribute('x2',x(i));guide.style.opacity=1;
    tip.innerHTML=`<b>${esc(cfg.tipLabels?cfg.tipLabels[i]:cfg.labels[i])}</b>`+ser.map(s=>`<div class="r"><span class="ch" style="--c:${s.color}"><i></i>${esc(s.name)}</span><b class="num" style="margin:0">${s.values[i]==null?'sin dato':fmt(s.values[i])}</b></div>`).join('');
    tip.style.opacity=1;const tw=tip.offsetWidth;let lx=x(i)*(r.width/W)+12;if(lx+tw>r.width)lx=x(i)*(r.width/W)-tw-12;tip.style.left=Math.max(0,lx)+'px'});
  svg.addEventListener('pointerleave',()=>{tip.style.opacity=0;guide.style.opacity=0});

function drawStars(){
  const c=$('#stars');if(!c)return;const dpr=Math.min(2,window.devicePixelRatio||1);const w=innerWidth,h=innerHeight;
  c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,w,h);
  let seed=7;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const n=Math.round(w*h/3800);
  for(let i=0;i<n;i++){const s=r();const rad=s>.985?1.6:s>.9?1.05:.6;x.globalAlpha=.25+r()*.7;x.fillStyle=s>.97?'#E9D5FF':s>.94?'#C7D2FE':'#FFFFFF';x.beginPath();x.arc(r()*w,r()*h,rad,0,7);x.fill();if(rad>1.5){x.globalAlpha=.18;x.beginPath();x.arc(r()*w,r()*h,4,0,7);x.fill()}}
}

let started=false;
function start(){
  if(!S.workspaces.length)return showOnboarding();
  if(!S.workspaces.find(w=>w.id===UI.ws)){UI.ws=S.workspaces[0].id;saveUI()}
  $('#gate').hidden=true;$('#app').hidden=false;$('#bottombar').hidden=false;
  buildDock();buildTabs();CUR=null;route();
  const q=new URLSearchParams(location.search);
  if(q.get('connected')){const p=SRV.providers[q.get('connected')];toast(`${p?p.label:'Cuenta'} conectada${+q.get('n')>1?` (${q.get('n')} cuentas)`:''}. Sincronizando datos…`);setTimeout(refreshAccounts,4000);setTimeout(refreshAccounts,15000)}
  if(q.get('conn_error'))openModal({title:'No se pudo conectar la cuenta',body:note(esc(q.get('conn_error')),'bad')+`<p class="small muted">Revisa la configuración de la app de desarrollador de esa red (claves y URL de redirección) en la sección Cuentas.</p>`,footer:'<button type="button" class="btn primary" data-close>Entendido</button>'});
  if(q.toString())history.replaceState(null,'',location.pathname+location.hash);
  if(!started&&MODE==='server'){started=true;setInterval(poll,15000);setInterval(refreshAccounts,120000)}
  started=true;
}
async function poll(){
  if(MODE!=='server'||dirty||saving)return;
  try{const r=await api('/api/state');if(r.stateVersion>SRV.stateVersion&&!dirty&&!saving){SRV.stateVersion=r.stateVersion;S=normalizeState(r.state);rerenderSoft()}}catch(e){}

async function boot(){
  applyTheme();
  let server=false;
  if(/^https?:$/.test(location.protocol)){try{const r=await fetch('/api/health',{cache:'no-store',credentials:'same-origin'});if(r.ok){const j=await r.json();server=!!j&&j.app==='galactivos-universe'}}catch(e){}}
  if(server){MODE='server';try{await loadBootstrap()}catch(e){if(e.status===401)return;showGate(`<div class="card glass">${note('No se pudo cargar la app desde el servidor: '+esc(e.message),'bad')}<button class="btn" onclick="location.reload()">Reintentar</button></div>`);return}}
  else{MODE='local';try{S=normalizeState(JSON.parse(localStorage.getItem(LOCAL_KEY)||'null'))}catch(e){S=normalizeState(null);STORAGE_OK=false}}
  start();
}

/* Drag & drop */
let DRAG=null;
document.addEventListener('dragstart',e=>{const t=e.target.closest&&e.target.closest('[data-drag]');if(!t)return;DRAG=t.dataset.drag;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',DRAG)}catch(_){}t.classList.add('dragging')});
document.addEventListener('dragend',e=>{const t=e.target.closest&&e.target.closest('[data-drag]');t&&t.classList.remove('dragging');$$('.over').forEach(x=>x.classList.remove('over'));DRAG=null});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z||!DRAG)return;e.preventDefault();if(!z.classList.contains('over')){$$('.over').forEach(x=>x.classList.remove('over'));z.classList.add('over')}});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z||!DRAG)return;e.preventDefault();const i=DRAG.indexOf(':');z.classList.remove('over');DROP[DRAG.slice(0,i)]&&DROP[DRAG.slice(0,i)](DRAG.slice(i+1),z.dataset.drop);DRAG=null});

/* Global events */
document.addEventListener('click',e=>{

  if(t.tagName==='INPUT')return fn(t.dataset.arg,t,e);
  e.preventDefault();fn(t.dataset.arg,t,e);
});

document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('[data-f]')&&(e.target.type==='search'||e.target.type==='text'))onF(e,true)});
document.addEventListener('change',e=>{if(e.target.matches&&e.target.matches('[data-f]')&&!(e.target.type==='search'||e.target.type==='text'))onF(e,false)});

/* ============ Métricas reales (servidor) ============ */
let MET={};
const daysBetween=(a,b)=>{const out=[];let d=parseD(a);const e=parseD(b);while(d<=e){out.push(iso(d));d=addDays(d,1)}return out};
function rangeOf(){
  const p=F('period','28');let len=+p||28,to=TODAY(),from=iso(addDays(today0(),-(len-1))),label=`los últimos ${len} días`,error='';
  if(p==='custom'){let a=F('pfrom',iso(addDays(today0(),-13))),b=F('pto',TODAY());if(a>b){error='La fecha inicial era posterior a la final; se han intercambiado.';[a,b]=[b,a]}
    if(dayDiff(b,a)+1>180){a=iso(addDays(parseD(b),-179));error='El rango máximo es de 180 días; se ha ajustado.'}
    from=a;to=b;len=dayDiff(b,a)+1;label=`del ${fmtD(a)} al ${fmtD(b)}`}
  const prevTo=iso(addDays(parseD(from),-1)),prevFrom=iso(addDays(parseD(from),-len));
  return{from,to,len,prevFrom,prevTo,label,error,key:`${prevFrom}|${to}`};
}
function getMetrics(rg){
  const ws=WS();const key=ws.id+'|'+rg.key;
  if(MET[key])return MET[key];
  if(MODE!=='server'){MET[key]={data:{daily:{}}};return MET[key]}
  MET[key]={loading:true};
  api(`/api/metrics?ws=${encodeURIComponent(ws.id)}&from=${rg.prevFrom}&to=${rg.to}`).then(r=>{MET[key]={data:r};if(CUR&&['resumen','analiticas','auditoria'].includes(CUR.id))rerenderSoft()}).catch(e=>{MET[key]={error:e.message};rerenderSoft()});
  return MET[key];
}
const pct=(c,p)=>c==null||p==null||p===0?null:(c-p)/Math.abs(p)*100;
function stats(accs,rg,daily){
  const cur=daysBetween(rg.from,rg.to),prev=daysBetween(rg.prevFrom,rg.prevTo);
  const tot={cur:{},prev:{}},per={},missing=[];
  for(const a of accs){
    const dd=daily[a.id]||{};per[a.id]={cur:{},prev:{}};
    for(const m of METRICS){
      const has=d=>dd[d]&&dd[d][m.k]!=null;
      const anyC=cur.some(has),anyP=prev.some(has);
      if(!anyC&&!anyP){missing.push({acc:a,k:m.k});per[a.id].cur[m.k]=null;per[a.id].prev[m.k]=null;continue}
      let c,p;
      if(m.flow){c=anyC?cur.reduce((s,d)=>s+(has(d)?dd[d][m.k]:0),0):null;p=anyP?prev.reduce((s,d)=>s+(has(d)?dd[d][m.k]:0),0):null}
      else{const lc=cur.filter(has).pop(),lp=prev.filter(has).pop();c=lc?dd[lc][m.k]:null;p=lp?dd[lp][m.k]:null}
      per[a.id].cur[m.k]=c;per[a.id].prev[m.k]=p;
      if(c!=null)tot.cur[m.k]=(tot.cur[m.k]||0)+c;if(p!=null)tot.prev[m.k]=(tot.prev[m.k]||0)+p;
    }
    const fH=d=>dd[d]&&dd[d].followers!=null;
    const fc=cur.filter(fH),fp=prev.filter(fH);
    const start=fp.length?dd[fp[fp.length-1]].followers:fc.length?dd[fc[0]].followers:null,end=fc.length?dd[fc[fc.length-1]].followers:null;
    per[a.id].cur.growth=start&&end!=null?(end-start)/start*100:null;
    per[a.id].prev.growth=fp.length>1&&dd[fp[0]].followers?(dd[fp[fp.length-1]].followers-dd[fp[0]].followers)/dd[fp[0]].followers*100:null;
    per[a.id].startF=start;
    const er=(o)=>o.interactions!=null&&(o.reach||o.impressions)?o.interactions/(o.reach||o.impressions)*100:null;
    per[a.id].cur.er=er(per[a.id].cur);per[a.id].prev.er=er(per[a.id].prev);
  }
  for(const k of METRICS.map(m=>m.k)){if(tot.cur[k]===undefined)tot.cur[k]=null;if(tot.prev[k]===undefined)tot.prev[k]=null}
  const fa=accs.filter(a=>per[a.id].startF&&per[a.id].cur.followers!=null);
  const s0=fa.reduce((s,a)=>s+per[a.id].startF,0),s1=fa.reduce((s,a)=>s+per[a.id].cur.followers,0);
  tot.cur.growth=fa.length&&s0?(s1-s0)/s0*100:null;
  const gp=accs.map(a=>per[a.id].prev.growth).filter(v=>v!=null);tot.prev.growth=gp.length?gp.reduce((a,b)=>a+b,0)/gp.length:null;
  return{tot,per,missing,cur,prev};
}
const seriesOf=(a,k,days,daily)=>{const dd=daily[a.id]||{};return days.map(d=>dd[d]&&dd[d][k]!=null?dd[d][k]:null)};
const sumSeries=(accs,k,days,daily)=>{let any=false;const out=days.map(d=>{let s=null;for(const a of accs){const v=daily[a.id]&&daily[a.id][d]&&daily[a.id][d][k];if(v!=null){s=(s||0)+v;any=true}}return s});return any?out:null};
function delta(c,p,{pp=false}={}){
  const d=pp?(c==null||p==null?null:c-p):pct(c,p);
  if(d==null)return`<span class="delta flat" title="No hay datos del periodo anterior">sin comparación</span>`;
  const cls=Math.abs(d)<.5?'flat':d>0?'up':'down';
  return`<span class="delta ${cls}" title="Respecto al periodo anterior"><span aria-hidden="true">${Math.abs(d)<.5?'=':d>0?'▲':'▼'}</span>${pp?fmtP(Math.abs(d),1).replace(' %',' pp'):fmtP(Math.abs(d),1)}<span class="sr">${d>0?'más':'menos'} que el periodo anterior</span></span>`;
}
function periodCtl(){
  const p=F('period','28'),rg=rangeOf();
  return`<div class="row">${seg('period',[['7','7 días'],['28','28 días'],['90','90 días'],['custom','Personalizado']],p,'Periodo')}
  ${p==='custom'?`<div class="row"><label class="small" for="p-from">Desde</label><input class="input" style="width:auto" type="date" id="p-from" data-f="pfrom" value="${esc(F('pfrom',iso(addDays(today0(),-13))))}" max="${TODAY()}"><label class="small" for="p-to">hasta</label><input class="input" style="width:auto" type="date" id="p-to" data-f="pto" value="${esc(F('pto',TODAY()))}" max="${TODAY()}"></div>`:''}</div>${rg.error?note(esc(rg.error),'warn'):''}`;
}
const selAccs=key=>{const all=connected();const s=F(key,[]).filter(id=>all.some(a=>a.id===id));return s.length?all.filter(a=>s.includes(a.id)):all};
function noAccountsHero(){

function ruleSummary(st,sa,rg){
  const {tot,per}=st;const out={resumen:'',cambios:[],acciones:[],faltan:[]};
  const r=pct(tot.cur.reach,tot.prev.reach),it=pct(tot.cur.interactions,tot.prev.interactions);
  const by=sa.map(a=>({a,d:pct(per[a.id].cur.reach??per[a.id].cur.impressions,per[a.id].prev.reach??per[a.id].prev.impressions)})).filter(x=>x.d!=null).sort((x,y)=>y.d-x.d);
  const best=by[0],worst=by[by.length-1];
  const parts=[];
  if(r!=null)parts.push(`el alcance total ${r>=0?'creció':'cayó'} un ${fmtP(Math.abs(r))} (${fmtN(tot.cur.reach)})`);
  if(it!=null)parts.push(`las interacciones ${it>=0?'subieron':'bajaron'} un ${fmtP(Math.abs(it))}`);
  out.resumen=parts.length?`En ${rg.label}, ${parts.join(' y ')}.`+(best&&best.d>0?` ${best.a.label||best.a.name} es la cuenta que más crece.`:''):`Aún no hay suficientes datos de ${rg.label} y del periodo anterior para comparar. Las conclusiones mejorarán a medida que se acumulen sincronizaciones.`;
  if(best&&best.d>2)out.cambios.push({titulo:`${best.a.label||best.a.name} lidera el crecimiento`,detalle:`+${fmtP(best.d)} de alcance respecto al periodo anterior.`,tipo:'positivo'});
  if(worst&&worst!==best&&worst.d<-2)out.cambios.push({titulo:`Baja ${worst.a.label||worst.a.name}`,detalle:`−${fmtP(Math.abs(worst.d))} de alcance respecto al periodo anterior.`,tipo:'negativo'});
  const erd=sa.map(a=>({a,d:per[a.id].cur.er!=null&&per[a.id].prev.er!=null?per[a.id].cur.er-per[a.id].prev.er:null})).filter(x=>x.d!=null).sort((x,y)=>x.d-y.d);
  if(erd[0]&&erd[0].d<-.3)out.cambios.push({titulo:`Menos interacción en ${erd[0].a.label||erd[0].a.name}`,detalle:`La tasa pasa de ${fmtP(per[erd[0].a.id].prev.er,2)} a ${fmtP(per[erd[0].a.id].cur.er,2)}.`,tipo:'negativo'});
  if(tot.cur.growth!=null)out.cambios.push({titulo:`Seguidores ${tot.cur.growth>=0?'+':''}${fmtP(tot.cur.growth,2)}`,detalle:`${fmtN(tot.cur.followers)} seguidores en total en las cuentas con este dato.`,tipo:tot.cur.growth>=0?'positivo':'negativo'});
  if(best&&best.d>2)out.acciones.push({accion:`Publica más del formato que mejor funciona en ${best.a.label||best.a.name}`,motivo:`Su alcance crece un ${fmtP(best.d)}.`,canal:NET[best.a.network].name});
  if(worst&&worst!==best&&worst.d<-2)out.acciones.push({accion:`Revisa horarios y temas en ${worst.a.label||worst.a.name}`,motivo:`El alcance cae un ${fmtP(Math.abs(worst.d))}.`,canal:NET[worst.a.network].name});
  const pend=commentsAll().filter(c=>c.status==='pendiente').length;
  if(pend)out.acciones.push({accion:`Responde los ${pend} comentarios pendientes`,motivo:'Responder rápido mejora la relación con tu comunidad.',canal:'Comentarios'});
  const next3=D().posts.filter(p=>p.status==='programado'&&dayDiff(p.date,TODAY())>=0&&dayDiff(p.date,TODAY())<=3).length;
  if(next3<2)out.acciones.push({accion:'Programa contenido para los próximos 3 días',motivo:`Hay ${next3} publicación${next3===1?'':'es'} programada${next3===1?'':'s'}.`,canal:'Calendario'});
  const seen=new Set();st.missing.forEach(x=>{const k=x.acc.id+x.k;if(seen.has(k))return;seen.add(k);out.faltan.push(`${x.acc.label||x.acc.name}: sin datos de ${MLABEL[x.k].toLowerCase()}${(x.acc.missing||[]).includes(x.k)?' (la red no lo ofrece por API)':' en este periodo'}.`)});
  return out;
}

/* ============ RADAR ============ */
let RADAR={};
const tViral=t=>{const v=.6*t.f.velocity+.4*t.f.volume;return v>=65?'alta':v>=40?'media':'baja'};
const SRC_COLOR={'Hacker News':'#FF8A4C',GitHub:'var(--ink-2)',Reddit:'#FF6B3D',Web:'var(--ch-web)',YouTube:'var(--ch-youtube)',X:'var(--ch-x)',TikTok:'var(--ch-tiktok)'};
function radarLoad(force){
  const ws=WS();const q=F('r-q','').trim();const key=ws.id+'|'+q;
  if(RADAR.key===key&&!force)return RADAR;
  RADAR={key,loading:true};
  api(`/api/radar?ws=${encodeURIComponent(ws.id)}&q=${encodeURIComponent(q)}`).then(r=>{if(RADAR.key===key){RADAR={key,data:r,at:Date.now()};if(CUR.id==='radar')rerenderSoft()}}).catch(e=>{if(RADAR.key===key){RADAR={key,error:e.message};if(CUR.id==='radar')rerenderSoft()}});
  return RADAR;
}
function trendCard(t,saved){
  const sc=t.score;const v=tViral(t);const FX=[['velocity','Velocidad',35,'Ritmo de crecimiento: puntuación o visualizaciones divididas por las horas desde su publicación.'],['volume','Volumen',25,'Cantidad de votos, estrellas, visualizaciones y comentarios.'],['affinity','Afinidad',25,`Coincidencia con tus temas${t.matched&&t.matched.length?': '+t.matched.join(', '):''}.`],['freshness','Frescura',15,`Publicado hace ${t.ageHours||'?'} horas.`]];
  return`<article class="card glass" aria-labelledby="t-${esc(t.id)}"><div class="row between"><div class="row" style="gap:8px"><span class="ch" style="--c:${SRC_COLOR[t.source]||'var(--accent)'}"><i></i>${esc(t.source)}</span><span class="xs muted">${ago(t.date)}</span></div><div class="score ${sc>=65?'':sc>=45?'mid':'low'}" title="Puntuación de interés">${sc}</div></div>
    <h3 id="t-${esc(t.id)}">${esc(t.title)}</h3><p class="desc">${esc(t.summary)}</p><div class="row" style="gap:6px">${pill('Viralidad '+v,v==='alta'?'accent':v==='media'?'info':'')}${(t.matched||[]).slice(0,3).map(k=>`<span class="tag">${esc(k)}</span>`).join('')}</div>
    <details><summary class="small" style="cursor:pointer;color:var(--accent);font-weight:700">Por qué esta puntuación</summary><div class="factors" style="margin-top:8px">${FX.map(([k,l,w,ex])=>`<div class="factor"><span>${l} <span class="muted">· peso ${w} %</span></span><b class="r num">${t.f[k]}</b><div class="bar-track"><div class="bar-fill" style="width:${t.f[k]}%"></div></div><p>${esc(ex)}</p></div>`).join('')}</div></details>
    <div class="acts"><button type="button" class="icon-btn sm" data-act="trSave" data-arg="${esc(t.id)}" aria-pressed="${!!saved}" aria-label="${saved?'Quitar de guardadas':'Guardar tendencia'}" title="${saved?'Guardada':'Guardar'}">${ic('bookmark',17)}</button>
      <button type="button" class="btn sm ghost" data-act="trIdea" data-arg="${esc(t.id)}">${ic('idea',15)}A idea</button><button type="button" class="btn sm ghost" data-act="trDraft" data-arg="${esc(t.id)}">${ic('edit',15)}Borrador</button>
      <a class="btn sm ghost" style="margin-left:auto" href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">${ic('ext',15)}Abrir<span class="sr"> en ${esc(t.source)} (nueva pestaña)</span></a></div></article>`;
}
function vRadar(){
  const d=D(),ws=WS();const saved=F('r-saved',false);
  const head=pageHead('Radar de tendencias',`Conversaciones con potencial para <b>${esc(ws.name)}</b>, buscadas en fuentes públicas y puntuadas según su encaje con tus temas (${esc((ws.topics||[]).join(', ')||'añade temas en «Editar negocio»')}).`);
  const savedIds=new Set(d.trends.map(t=>t.id));
  if(MODE!=='server')return`${head}${note('El radar consulta Hacker News, GitHub, Reddit, noticias web y YouTube desde tu servidor. En modo local no puede buscar; aquí verás las tendencias que hayas guardado.','warn')}${d.trends.length?`<div class="grid g-cards">${d.trends.map(t=>trendCard(t,true)).join('')}</div>`:empty('radar','Sin tendencias guardadas','Ejecuta el servidor para buscar tendencias reales.')}`;
  const R=saved?{data:{items:[]}}:radarLoad();
  const srcs=F('r-src',[]),dt=F('r-date','7'),rel=+F('r-rel','0'),vir=F('r-vir','todas'),sort=F('r-sort','score');
  const st=SRV.radarSources||{};
  let items=saved?d.trends:(R.data?R.data.items:[]);
  const lim={'1':24,'7':168,'30':720,all:1e9}[dt];
  items=items.filter(t=>(!srcs.length||srcs.includes(t.source))&&(Date.now()-new Date(t.date))/36e5<=lim&&t.f.affinity>=rel&&(vir==='todas'||tViral(t)===vir));
  items=[...items].sort((a,b)=>sort==='date'?new Date(b.date)-new Date(a.date):sort==='velocity'?b.f.velocity-a.f.velocity:b.score-a.score);

  return`${head}
  <div class="panel glass stack" style="padding:14px 16px"><form class="toolbar" id="r-form">${`<div class="search">${ic('search',16)}<label class="sr" for="r-q">Buscar tema</label><input class="input" type="search" id="r-q" value="${esc(F('r-q',''))}" placeholder="Busca un tema (vacío = tus temas)"></div>`}<button type="submit" class="btn primary">${ic('search',15)}Buscar</button>${sel('r-sort',[['score','Por interés'],['date','Más recientes'],['velocity','Más rápidas']],sort,'Orden')}</form>
    <div class="chips" role="group" aria-label="Fuentes"><button type="button" class="fchip" data-act="togAll" data-arg="r-src" aria-pressed="${!srcs.length}">Todas</button>${Object.values(st).filter(s=>s.available).map(s=>`<button type="button" class="fchip" data-act="tog" data-arg="r-src|${s.label}" aria-pressed="${srcs.includes(s.label)}"><span class="ch" style="--c:${SRC_COLOR[s.label]}"><i></i>${s.label}</span></button>`).join('')}</div>
    <div class="toolbar">${sel('r-date',[['1','Últimas 24 horas'],['7','Últimos 7 días'],['30','Últimos 30 días'],['all','Cualquier fecha']],dt,'Fecha')}${sel('r-rel',[['0','Cualquier afinidad'],['50','Afinidad ≥ 50'],['70','Afinidad ≥ 70']],String(rel),'Relevancia mínima')}${sel('r-vir',[['todas','Cualquier viralidad'],['alta','Viralidad alta'],['media','Viralidad media'],['baja','Viralidad baja']],vir,'Potencial viral')}<label class="toggle"><input type="checkbox" id="f-r-saved" data-f="r-saved" ${saved?'checked':''}>Solo guardadas (${d.trends.length})</label>${!saved?`<button type="button" class="btn sm ghost" data-act="radarRefresh">${ic('refresh',15)}Actualizar</button>`:''}</div></div>
  ${unavailable.length?`<p class="xs muted">${unavailable.map(s=>`${s.label}: ${esc(s.reason)}`).join(' · ')}</p>`:''}
  ${errs.length?note('Algunas fuentes no respondieron: '+esc(errs.join(' · ')),'warn'):''}
  ${R.loading?`<div class="panel glass">${thinking('Buscando tendencias en las fuentes…')}</div>`:R.error?note(esc(R.error),'bad'):`<p class="small muted" aria-live="polite">${items.length} tendencia${items.length===1?'':'s'}${R.data&&R.data.terms&&!saved?` para «${esc(R.data.terms.join('», «'))}»`:''}</p>${items.length?`<div class="grid g-cards">${items.map(t=>trendCard(t,savedIds.has(t.id))).join('')}</div>`:empty('radar','Nada con estos filtros','Amplía el rango de fechas, baja la afinidad mínima o busca otro tema.',`<button type="button" class="btn" data-act="clearF" data-arg="r-src,r-date,r-rel,r-vir,r-saved">Limpiar filtros</button>`)}`}`;
}

const hashtagify=s=>'#'+norm(s).split(/\s+/).map((w,i)=>i?cap(w):w).join('').replace(/[^\w]/g,'');
function localAdapt(text,n,tags){
  const ws=WS();const tg=(tags.length?tags:(ws.topics||[]).slice(0,2)).slice(0,3).map(hashtagify).join(' ');
  if(n==='x'){let t=text.replace(/\n{2,}/g,'\n');if(t.length>275){t=t.slice(0,272);t=t.slice(0,t.lastIndexOf(' '))+'…'}return t}
  if(n==='instagram'||n==='tiktok')return tg?`${text}\n\n${tg}`:text;
  if(n==='linkedin')return/\?/.test(text)?text:`${text}\n\n¿Qué opinas?`;
  return text;
}

      <div class="field"><label for="cm-reply" class="sr">Respuesta</label><textarea class="textarea" id="cm-reply" rows="4" placeholder="Escribe tu respuesta…">${esc(c.draft||'')}</textarea><div class="row between"><span class="counter" id="cm-cnt">${(c.draft||'').length} caracteres</span><span class="xs muted">El borrador se guarda solo.</span></div><div class="err" id="cm-err" hidden></div></div>
      <div class="row" style="justify-content:flex-end">${canReply?`<button type="button" class="btn primary" data-act="cmSend">${ic('send',15)}Revisar y enviar</button>`:`<button type="button" class="btn" data-act="cmCopy">${ic('copy',15)}Copiar respuesta</button>`}</div></section>`}
  return`${head}<div class="panel glass stack" style="padding:14px 16px">${accChips('c-acc',accs)}<div class="toolbar">${searchBox('c-q','Buscar por texto, autor o publicación')}${seg('c-st',[['pendiente','Pendientes'],['resuelto','Resueltos'],['todos','Todos']],st,'Estado')}${sel('c-prio',[['todas','Toda prioridad'],['alta','Alta'],['media','Media'],['baja','Baja']],pr,'Prioridad')}${sel('c-sort',[['reciente','Más recientes'],['prioridad','Por prioridad']],F('c-sort','reciente'),'Orden')}</div></div>
  ${SYNCED[ws.id]&&SYNCED[ws.id].loading?`<div class="panel glass">${thinking('Cargando comentarios…')}</div>`:list.length?`<div class="split ${detail?'detail-open':''}"><section class="list-pane"><p class="xs muted">${list.length} comentario${list.length===1?'':'s'}</p><div class="list-items">${items}</div></section><section class="stack detail-pane">${det}</section></div>`:empty('comment',all.length?'Sin resultados':'Bandeja al día',all.length?'Ningún comentario coincide con los filtros.':'No hay comentarios pendientes en las cuentas conectadas.',all.length?`<button type="button" class="btn" data-act="clearF" data-arg="c-acc,c-q,c-prio,c-st">Ver todos</button>`:'')}`;
}
const curComment=()=>{const id=$('.li[aria-current="true"]')?.dataset.arg;return commentsAll().find(x=>x.id===id)};
AFTER.comentarios=()=>{const c=curComment();const ta=$('#cm-reply');if(!c||!ta)return;const m=cMeta(c.id);if(!m.seen){m.seen=true;save();const li=$('.li[aria-current="true"]');li&&li.classList.remove('unread')}
  ta.addEventListener('input',()=>{m.draft=ta.value;$('#cm-cnt').textContent=ta.value.length+' caracteres';$('#cm-err').hidden=true;ta.setAttribute('aria-invalid','false');scrSave()});
  const p=$('#cm-prio');p&&p.addEventListener('change',()=>{m.priority=p.value;save();rerender()})};
Object.assign(ACT,{
  cmRefresh(){SYNCED={};rerender()},cmSel(id){setF('c-sel',id);setF('c-detail',true);rerender()},cmBack(){setF('c-detail',false);rerender()},
  cmToggle(id){const c=commentsAll().find(x=>x.id===id);const m=cMeta(id);const was=c.status;m.status=was==='resuelto'?'pendiente':'resuelto';save();
    if(m.status==='resuelto'&&F('c-st','pendiente')==='pendiente'){const l=$$('.li[data-act="cmSel"]').map(b=>b.dataset.arg);const i=l.indexOf(id);setF('c-sel',l[i+1]||l[i-1]||null)}
    rerender();toast(m.status==='resuelto'?'Comentario resuelto':'Comentario pendiente','good',{label:'Deshacer',fn:()=>{m.status=was;setF('c-sel',id);save();rerender()}})},
  async cmAI(){const c=curComment();if(!c)return;const ta=$('#cm-reply'),btn=$('#cm-ai');btn.disabled=true;btn.innerHTML=thinking('Redactando…');
    const prompt=`Redacta una respuesta breve (máximo 3 frases), cercana y profesional, en español, a este comentario recibido en ${NET[c.network].name} por "${WS().name}"${WS().url?` (${WS().url})`:''}. No prometas nada concreto (precios, fechas, descuentos); si falta información, invita a escribir por mensaje privado. Si es spam, responde solo: [SPAM]. Devuelve únicamente el texto de la respuesta.
Publicación: «${c.postTitle}»
Comentario de ${c.author}: «${c.text}»`;
    try{const r=await askAI(prompt,{cache:false,onText:({text})=>{if(ta.isConnected)ta.value=text}});const t=(r.text||'').trim();
      if(t==='[SPAM]'){ta.value='';toast('Parece spam: márcalo como resuelto sin responder.','info')}else{cMeta(c.id).draft=t;ta.value=t;$('#cm-cnt').textContent=t.length+' caracteres';save();toast('Respuesta sugerida. Revísala antes de enviarla.')}}
    catch(e){toast(aiErr(e.code,e.message),'bad')}finally{if(btn.isConnected){btn.disabled=false;btn.innerHTML=`${ic('wand',15)}Sugerir respuesta`}}},
  async cmCopy(){const t=$('#cm-reply').value.trim();if(!t)return toast('Escribe una respuesta.','bad');try{await navigator.clipboard.writeText(t);toast('Respuesta copiada')}catch(e){toast('No se pudo copiar. Selecciona el texto y cópialo.','bad')}},
  cmSend(){const c=curComment();if(!c)return;const ta=$('#cm-reply');const txt=ta.value.trim();const er=$('#cm-err');
    const lim=c.network==='x'?280:2200;
    if(txt.length<2||txt.length>lim){er.hidden=false;er.innerHTML=`${ic('alert',14,2.2)}<span>${txt.length<2?'Escribe una respuesta antes de enviarla.':`${NET[c.network].name} admite hasta ${lim} caracteres (llevas ${txt.length}).`}</span>`;ta.setAttribute('aria-invalid','true');ta.setAttribute('aria-describedby','cm-err');ta.focus();return}
    const a=accById(c.accountId);
    const m=openModal({title:'Revisa antes de publicar la respuesta',body:`${note(`Se publicará <b>de verdad</b> en ${NET[c.network].name} desde la cuenta <b>${esc(a?a.label||a.name:'')}</b>${a&&a.handle?` (${esc(a.handle)})`:''}.`,'warn')}
      <div class="stack tight"><span class="eyebrow">En</span><div>${c.postUrl?`<a href="${esc(c.postUrl)}" target="_blank" rel="noopener noreferrer">«${esc(c.postTitle)}»</a>`:`«${esc(c.postTitle)}»`}</div></div>
      <div class="stack tight"><span class="eyebrow">Respondes a</span><div class="bubble"><div class="who"><b>${esc(c.author)}</b><span>${esc(c.handle)}</span><span>${fmtDT(c.date)}</span></div>${esc(c.text)}</div></div>
      <div class="stack tight"><span class="eyebrow">Tu respuesta</span><div class="bubble mine">${esc(txt)}</div></div><label class="check"><input type="checkbox" id="cm-res" checked>Marcar como resuelto</label>`,
      footer:`<button type="button" class="btn" data-close>Volver a editar</button><button type="button" class="btn primary" id="cm-ok">${ic('send',15)}Publicar respuesta</button>`});
    $('#cm-ok',m.el).onclick=async()=>{const b=$('#cm-ok',m.el);b.disabled=true;b.innerHTML=thinking('Publicando…');
      try{const r=await api('/api/comments/reply',{method:'POST',body:{commentId:c.id,text:txt}});const cache=SYNCED[WS().id];if(cache&&cache.data){cache.data.comments=cache.data.comments.map(x=>x.id===c.id?r.comment:x)}
        const meta=cMeta(c.id);meta.draft='';if($('#cm-res',m.el).checked)meta.status='resuelto';save();m.close();rerender();toast(`Respuesta publicada en ${NET[c.network].name}`)}
      catch(e){m.close();toast('No se pudo publicar la respuesta: '+e.message,'bad')}}},
});



/* ============ Arranque ============ */
window.addEventListener('focus',()=>{if(MODE==='server')poll()});
document.addEventListener('visibilitychange',()=>{if(MODE==='server'&&document.visibilityState==='visible')poll()});
boot();

</script>
</body></html>
